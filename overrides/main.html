{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="theme-color" content="#0f172a" />
  <meta name="site-base" content="{{ config.site_url }}" />
{% endblock %}

{% block fonts %}
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
  <style>:root{--md-text-font:"Roboto",system-ui,-apple-system,sans-serif;--md-code-font:"Roboto Mono",ui-monospace,monospace}</style>
{% endblock %}

{% block tabs %}
{# 顶栏导航已移至 overrides/partials/header.html（dn-topnav），勿再启用 navigation.tabs #}
{% endblock %}
