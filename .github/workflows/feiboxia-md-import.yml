name: 飞博虾·Markdown 导入

on:
  repository_dispatch:
    types: [feiboxia-md-import]
  workflow_dispatch:
    inputs:
      payload_json:
        description: "client_payload JSON"
        required: false
        default: "{}"

permissions:
  contents: write

jobs:
  md-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register job pending
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          CLIENT_PAYLOAD="$(node -e "const p=JSON.parse(process.env.CLIENT_PAYLOAD||'{}');p.job_type=p.job_type||'md-import';process.stdout.write(JSON.stringify(p))")" \
            node feiboxia/register-job.mjs
          git config user.name "feiboxia-bot"
          git config user.email "feiboxia@users.noreply.github.com"
          git add feiboxia/queue/jobs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: Markdown 导入任务排队"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and configure lark-cli
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          npm i -g @larksuite/cli
          if [ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ]; then
            mkdir -p "$HOME/.lark-cli"
            node -e "const fs=require('fs');const id=process.env.FEISHU_APP_ID;const sec=process.env.FEISHU_APP_SECRET;const p=require('path').join(process.env.HOME,'.lark-cli','config.json');fs.writeFileSync(p,JSON.stringify({appId:id,appSecret:sec,lang:'zh_cn',brand:'feishu',profile:id,profiles:{[id]:{appId:id,appSecret:sec}}},null,2));"
          fi

      - name: Run markdown import
        id: import
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NOTIFY_OPEN_ID: ${{ secrets.FEISHU_NOTIFY_OPEN_ID }}
          CLIENT_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload_json }}
        run: node feiboxia/ci-md-import.mjs

      - name: Commit job status
        if: always()
        run: |
          git config user.name "feiboxia-bot"
          git config user.email "feiboxia@users.noreply.github.com"
          git add feiboxia/queue/jobs/ feiboxia/queue/md-import.last.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Markdown 导入任务状态"
            git push
          fi

      - name: Fail if import failed
        if: steps.import.outcome == 'failure'
        run: exit 1
