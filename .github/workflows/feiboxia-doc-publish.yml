name: 飞博虾·文档发布

# 文档内「飞博虾」小组件通过 repository_dispatch 触发
# 1) 写入飞书博客台账  2) 尽量拉取正文写入 docs/

on:
  repository_dispatch:
    types: [feiboxia-doc-publish]
  workflow_dispatch:
    inputs:
      payload_json:
        description: "client_payload JSON"
        required: false
        default: "{}"

permissions:
  contents: write
  actions: write

jobs:
  publish-from-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register job pending
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          CLIENT_PAYLOAD="$(node -e "const p=JSON.parse(process.env.CLIENT_PAYLOAD||'{}');p.job_type='publish';process.stdout.write(JSON.stringify(p))")" \
            node feiboxia/register-job.mjs
          git config user.name "feiboxia-bot"
          git config user.email "feiboxia@users.noreply.github.com"
          git add feiboxia/queue/jobs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 发布任务排队"
            git pull --rebase --autostash origin main || git pull --rebase origin main || true
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare payload
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJson(github.event.client_payload) }}' > /tmp/payload.json
          else
            echo '${{ inputs.payload_json }}' > /tmp/payload.json
          fi
          cp /tmp/payload.json feiboxia/queue/doc-dispatch.json
          cat feiboxia/queue/doc-dispatch.json

      - name: Install and configure lark-cli
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          npm i -g @larksuite/cli
          if [ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ]; then
            mkdir -p "$HOME/.lark-cli"
            node -e "const fs=require('fs');const id=process.env.FEISHU_APP_ID;const sec=process.env.FEISHU_APP_SECRET;const p=require('path').join(process.env.HOME,'.lark-cli','config.json');fs.writeFileSync(p,JSON.stringify({appId:id,appSecret:sec,lang:'zh_cn',brand:'feishu',profile:id,profiles:{[id]:{appId:id,appSecret:sec}}},null,2));"
          fi

      - name: Run feiboxia doc publish
        id: publish
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CLIENT_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload_json }}
        run: node feiboxia/ci-doc-publish.mjs

      - name: Commit job status and retry queue
        if: always()
        run: |
          git config user.name "feiboxia-bot"
          git config user.email "feiboxia@users.noreply.github.com"
          git add sync/publish-retry-queue.json feiboxia/queue/jobs/ feiboxia/queue/doc-dispatch.last.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 发布任务状态"
            git pull --rebase --autostash origin main || git pull --rebase origin main || true
            git push
          fi

      - name: Commit docs if changed
        id: docs
        if: steps.publish.outcome == 'success'
        run: |
          if git diff --quiet docs sync/feishu-map.json 2>/dev/null && git diff --cached --quiet docs sync/feishu-map.json 2>/dev/null; then
            echo "No doc file changes — skip commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/build-posts-index.mjs
          git config user.name "feiboxia-bot"
          git config user.email "feiboxia@users.noreply.github.com"
          git add docs sync/feishu-map.json docs/javascripts/posts-index.json docs/javascripts/posts-index-preview.json docs/javascripts/calendar-index.json
          git commit -m "docs: 飞博虾文档内发布"
          git pull --rebase --autostash origin main || git pull --rebase origin main || true
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送不会触发其他 workflow，须显式拉起 Pages 部署
      - name: Trigger Pages deploy
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Fail if publish failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "发布失败，已写入晚间重试队列（21:00 自动重试）"
          exit 1
